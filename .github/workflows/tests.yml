name: tests

on:
  push:
    branches: [master, 2.x]
  pull_request:
  schedule:
    # A monthly run catches a new Laravel or PHP release breaking the matrix
    # before a merchant discovers it in production.
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency-version }}

    strategy:
      fail-fast: false
      matrix:
        # Testbench major to Laravel major:
        #   4 -> L6, 5 -> L7, 6 -> L8, 7 -> L9, 8 -> L10, 9 -> L11, 10 -> L12, 11 -> L13
        #
        # Laravel 5.5-5.8 is absent here on purpose: testbench 3.5 pins
        # phpunit ^6.5 and this suite needs assertions added in phpunit 9.1.
        # That lower range is covered by the `legacy-bootstrap` job below, which
        # boots the provider against a real Illuminate container without
        # testbench and checks the signature bytes against the golden vectors.
        include:
          # Lower bound of the testbench-reachable range.
          - { php: '7.4', laravel: '6.*', eol-framework: true,  testbench: '4.*',  dependency-version: prefer-stable }
          - { php: '7.4', laravel: '7.*', eol-framework: true,  testbench: '5.*',  dependency-version: prefer-stable }
          - { php: '7.4', laravel: '8.*', eol-framework: true,  testbench: '^6.6',  dependency-version: prefer-lowest }
          - { php: '7.4', laravel: '8.*', eol-framework: true,  testbench: '6.*',  dependency-version: prefer-stable }
          - { php: '8.0', laravel: '9.*', eol-framework: true,  testbench: '7.*',  dependency-version: prefer-stable }
          - { php: '8.1', laravel: '10.*', eol-framework: true, testbench: '8.*',  dependency-version: prefer-lowest }
          - { php: '8.1', laravel: '10.*', eol-framework: true, testbench: '8.*',  dependency-version: prefer-stable }
          - { php: '8.2', laravel: '11.*', eol-framework: true, testbench: '9.*',  dependency-version: prefer-stable }
          - { php: '8.3', laravel: '11.*', eol-framework: true, testbench: '9.*',  dependency-version: prefer-stable }
          - { php: '8.2', laravel: '12.*', testbench: '10.*', dependency-version: prefer-stable }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', dependency-version: prefer-stable }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', dependency-version: prefer-stable }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', dependency-version: prefer-stable }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', dependency-version: prefer-lowest }

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Permit end-of-life framework versions to install
        # Laravel 8, 9, 10 and 11 are end of life and EVERY release in those
        # lines carries unpatched security advisories, so Composer refuses to
        # install them by default. This matrix exists to prove that the package
        # API still works against those framework versions -- it is not an
        # endorsement of running an EOL framework in production, and the
        # `coverage` job keeps the advisory policy switched on.
        if: matrix.eol-framework
        run: composer config --no-plugins policy.advisories.block false

      - name: Resolve dependencies for this Laravel version
        # The Laravel 8 prefer-lowest row floors testbench at ^6.6 because
        # testbench-core 6.0-6.5 call TestCase::getAnnotations(), which does not
        # exist on PHPUnit 9 (it was a PHPUnit 8 API, and our suite needs
        # assertions added in 9.1). 6.6.0 is the first release that dropped the
        # call. This is an incompatibility between two dev tools, unrelated to
        # the package under test.
        run: |
          composer require --no-update --no-interaction \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.dependency-version }} --no-interaction --no-progress

      - name: Report the resolved versions
        # composer show accepts at most one package name, so query them one at a time.
        run: |
          for pkg in laravel/framework orchestra/testbench phpunit/phpunit; do
            printf '%-26s %s\n' "$pkg" "$(composer show "$pkg" 2>/dev/null | awk '/^versions/ {print $3}')"
          done

      - name: Run the test suite
        run: vendor/bin/phpunit

  legacy-bootstrap:
    runs-on: ubuntu-latest
    name: Laravel ${{ matrix.laravel }} bootstrap (no testbench)

    # Proves the lower half of the declared illuminate/support range really
    # works. testbench cannot reach it -- testbench 3.5 pins phpunit ^6.5 while
    # this suite needs phpunit 9.1 assertions -- so instead of leaving Laravel
    # 5.5-7 as an untested claim in composer.json, this job boots the service
    # provider against a real Illuminate container, resolves every binding,
    # resolves the facade, and re-signs all 90 frozen golden HMAC vectors. A
    # signature that differs on an old framework is a rejected payment, so the
    # vectors are the assertion that matters.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.3', laravel: '5.5.*' }
          - { php: '7.4', laravel: '5.8.*' }

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Permit end-of-life framework versions to install
        run: composer config --no-plugins policy.advisories.block false

      - name: Allow the carbon 1.x composer plugin
        # nesbot/carbon 1.x (Laravel 5.5) ships kylekatarnls/update-helper, a
        # composer plugin that modern composer blocks by default. Denying it
        # explicitly suppresses the hard error without running it.
        run: composer config --no-plugins allow-plugins.kylekatarnls/update-helper false

      - name: Install Laravel ${{ matrix.laravel }}
        # Two things here are load-bearing.
        #
        # 1. The dev block has to actually GO, not merely be skipped at install
        #    time. `composer update --no-dev` still RESOLVES require-dev, and
        #    orchestra/testbench pulls laravel/framework, which `replaces`
        #    illuminate/*, so leaving it in yields
        #      "laravel/framework replaces illuminate/view and thus cannot
        #       coexist with it"
        #    and nothing resolves. Removing it is what keeps phpunit out, which
        #    is the entire point of this job.
        #
        # 2. laravel/framework, not the illuminate/* split packages. The shipped
        #    config file calls env(), and env() lives in illuminate/support's
        #    helpers but depends on vlucas/phpdotenv and phpoption/phpoption --
        #    which only laravel/framework brings in. Installing illuminate/support
        #    alone fails at mergeConfigFrom() with
        #      Class 'PhpOption\Option' not found
        #    which is an artifact of the harness, not a package defect: a real
        #    application always has the framework present.
        run: |
          composer remove --dev --no-update --no-interaction \
            orchestra/testbench phpunit/phpunit
          composer require --no-update --no-interaction \
            "laravel/framework:${{ matrix.laravel }}"
          composer update --no-interaction --no-progress --prefer-stable

      - name: Report the resolved version
        run: composer show laravel/framework | awk '/^versions/ {print $3}'

      - name: Boot the provider and verify signature parity
        run: php tests/Legacy/bootstrap-check.php

  wire-parity:
    runs-on: ubuntu-latest
    name: wire parity with v1.4 (PHP ${{ matrix.php }})

    # The release gate that stands in for a gateway sandbox.
    #
    # 2.x rewrote the signing and transport path, and there is no Paycorp
    # sandbox available to confirm the bank still accepts what it produces. So
    # instead this proves the next best thing, and arguably the stricter thing:
    # that 2.x puts BYTE-IDENTICAL requests on the wire as v1.4, which is known
    # to have been accepted in production for years.
    #
    # Both versions post through real curl to a local capture server, so what
    # is compared is the actual byte stream -- body, HMAC header, AUTHTOKEN
    # header, Content-Type, method -- for all nine signed operations. Only
    # msgId and requestDate are replayed from the v1.4 run, because those are
    # the two fields 1.x generates nondeterministically; everything else must
    # match on its own merit.
    #
    # PHP 7.4 is included because that is where 1.x was actually functional:
    # several of its helpers index responses with unquoted array keys, which is
    # a warning on PHP 7 and a fatal Error on PHP 8.
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']

    steps:
      - uses: actions/checkout@v5
        with:
          # The harness extracts the v1.4 source with `git archive`, so the
          # tag has to be present -- a shallow default clone does not have it.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install production dependencies only
        # The dev block is REMOVED, not merely skipped. `--no-dev` still
        # resolves require-dev, and on the 7.4 row that fails outright
        # ("orchestra/testbench[v8.0.0, ...] require php ^8.1 -> your php
        # version (7.4.33) does not satisfy that requirement"). Same trap as
        # the legacy-bootstrap job.
        #
        # The harness needs none of it: it touches only this package's own
        # classes and its autoloader, never testbench or phpunit.
        run: |
          composer remove --dev --no-update --no-interaction \
            orchestra/testbench phpunit/phpunit
          composer update --no-dev --no-interaction --no-progress

      - name: v1.4 and the working tree must send identical bytes
        run: ./tests/Differential/wire-parity.sh

  coverage:
    runs-on: ubuntu-latest
    name: coverage
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: pcov
          tools: composer:v2
      - run: composer update --no-interaction --no-progress
      - name: Enforce a coverage floor on the security-critical code
        run: |
          vendor/bin/phpunit --coverage-text --coverage-filter src --coverage-clover=coverage.xml
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            $m = $xml->project->metrics;
            $pct = $m["statements"] > 0 ? 100 * $m["coveredstatements"] / $m["statements"] : 0;
            printf("line coverage: %.2f%%\n", $pct);
            if ($pct < 80.0) { fwrite(STDERR, "coverage below the 80% floor\n"); exit(1); }
          '

  static-analysis:
    runs-on: ubuntu-latest
    name: lint and static analysis
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2, phpstan
      - run: composer update --no-interaction --no-progress
      - name: Lint every file on the lowest supported PHP syntax
        run: find src config -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan, whole package at level 5
        run: phpstan analyse -c phpstan.neon.dist --no-progress --no-interaction

      - name: PHPStan, code written for 2.x at level 9
        run: phpstan analyse -c phpstan-strict.neon.dist --no-progress --no-interaction

  syntax-floor:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} syntax floor
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Every shipped file must parse on the declared minimum PHP
        # tests/Legacy is included: bootstrap-check.php is the one test file
        # that actually executes on a legacy PHP, so a syntax error there is a
        # broken job rather than a skipped one.
        run: find src config tests/Legacy -name '*.php' -print0 | xargs -0 -n1 php -l
